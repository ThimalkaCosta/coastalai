# render.yaml – Render Blueprint for CoastalAI Backend
# https://docs.render.com/blueprint-spec
services:
  - type: web
    name: coastalai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NOTEBOOK_PATH
        value: /app/notebook.ipynb
      - key: WORK_DIR
        value: /tmp/coastalai
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health
